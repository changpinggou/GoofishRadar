# =====================================================================
# GoofishRadar 全局配置（T03）
# 改本文件即可生效，无需改代码；非法值会在启动时（config-check / run）报错
# 并指明具体字段。带「硬顶」的项超限后自动截断并告警，见各条注释。
# 注意：本工具仅支持手动运行（.venv/bin/goofishradar run），
#       不含任何定时/开机自启动能力（原 schedule 调度已移除）。
# =====================================================================

limits:
  # 相邻两次页面请求的随机延时区间（秒）。T01 实测单页稳定耗时 6–9s，
  # 默认 8–20（原 PRD 草案 5–15 偏紧，已按实测修订）；最小值 < 5 会收到风控告警。
  page_delay_seconds: [8, 20]
  max_pages_per_keyword: 3     # 单关键词采集页数；代码硬顶 50，超限自动截断并告警
  max_pages_per_day: 300       # 单日总页数；代码硬顶 300，超限自动截断并告警
  retry_backoff_seconds: [60, 300]  # 关键词失败重试退避（秒），仅非风控失败重试
  risk_cooldown_minutes: 120        # 触发风控后的冷却档位（分钟），期内拒绝一切网络请求

ranking:
  topn_overall: 50           # 总榜 TopN
  topn_per_keyword: 20       # 分关键词榜 TopN
  topn_rising: 20            # 热度飙升榜 TopN
  weights:                   # 畅销度评分权重（需求文档第 8 节），四项之和必须 = 1.0
    want_count: 0.40         # 想要数绝对值
    view_count: 0.20         # 浏览量绝对值
    want_delta_7d: 0.25      # 想要数 7 日增量
    view_delta_7d: 0.15      # 浏览量 7 日增量

report:
  retain_days: 90            # 报告/快照保留天数

paths:                       # 相对路径基于项目根目录解析；也可用绝对路径
  data_dir: data
  reports_dir: reports
  logs_dir: logs

notify:                      # 告警推送（T12）：渠道留空即禁用；全部禁用时降级为本地标记 data/ALERT
  webhook_url: ""            # 钉钉/飞书群机器人 Webhook 地址
  webhook_channel: "feishu"  # feishu | dingtalk
  smtp:                      # 邮件渠道（host 留空即禁用）
    host: ""
    port: 465
    user: ""
    password: ""             # 安全建议：保持留空，运行时经环境变量 GOOFISH_SMTP_PASSWORD 注入
    to: ""                   # 收件邮箱
    use_tls: true
