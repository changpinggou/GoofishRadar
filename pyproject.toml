[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goofishradar"
version = "0.1.0"
description = "GoofishRadar — 闲鱼畅销商品排行榜自动化工具（闲鱼热卖雷达）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openpyxl>=3.1",
]

[project.scripts]
goofishradar = "goofishradar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goofishradar = ["templates/*.j2"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
